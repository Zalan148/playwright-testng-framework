name: Playwright TestNG Diagnostics

on:
  push:
    branches: [ main, module-3 ]
  pull_request:
    branches: [ main ]


jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          npm install
          mvn install -DskipTests

      - name: Install Playwright dependencies
        run: |
          for i in 1 2 3; do
              npx playwright install-deps && break || sleep 30
          done

      - name: Run TestNG diagnostic suite
        run: |
          mvn test -Dsurefire.suiteXmlFiles=testng-diagnostic.xml -Dbrowser=chromium -Dheadless=true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-diagnostic
          path: target/allure-results

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos-diagnostic
          path: videos