name: Playwright TestNG CI

on:
  push:
    branches: [ main, module-3 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04 ]
        browser: [ firefox, chromium, webkit ]
        headless: [ true ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install
          mvn install -DskipTests

      - name: Install Playwright dependencies
        run: |
          for i in 1 2 3; do
              npx playwright install-deps && break || sleep 30
          done

      - name: Start mock server
        run: |
          nohup node server.js &
          sleep 5

      - name: Run TestNG suite
        run: |
          if [ "${{ matrix.browser }}" = "firefox" ]; then
            mvn test -DsuiteXmlFile=testng.xml -Dbrowser=firefox -Dheadless=true -Ddataproviderthreadcount=1 -DforkCount=1
          else
            mvn test -DsuiteXmlFile=testng.xml -Dbrowser=${{ matrix.browser }} -Dheadless=${{ matrix.headless }}
          fi

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.os }}-${{ matrix.browser }}-${{ matrix.headless }}
          path: target/allure-results

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos-${{ matrix.os }}-${{ matrix.browser }}-${{ matrix.headless }}
          path: videos

