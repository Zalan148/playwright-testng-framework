name: Playwright Visual Regression CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  visual-tests:
    runs-on: ubuntu-22.04
    strategy:
     fail-fast: false
     matrix:
       include:
         - browser: chromium
           suite: testng-visual-chromium.xml

         - browser: firefox
           suite: testng-visual-firefox.xml

         - browser: webkit
           suite: testng-visual-webkit.xml

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Install project dependencies
      - name: Install dependencies
        run: |
          npm install
          mvn install -DskipTests

      # Install Playwright system dependencies (with retry loop for stability)
      - name: Install Playwright dependencies
        run: |
          for i in 1 2 3; do
              npx playwright install-deps && break || sleep 30
          done

      # Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install

      # Run visual regression tests (per browser)
      - name: Run VisualRegressionTest suite
        run: mvn test -DsuiteXmlFile=${{ matrix.suite }}

      - name: Show generated screenshots
        if: always()
        run: |
          find target -type f | sort


      # Upload allure results (always)
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results

      # Upload videos (always)
      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos-${{ matrix.browser }}
          path: videos

      # Upload visual regression artifacts (only if tests fail)
      - name: Upload current screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-current-${{ matrix.browser }}
          path: target/*-${{ matrix.browser }}-current.png
          retention-days: 7

      - name: Upload diff screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs-${{ matrix.browser }}
          path: target/*-${{ matrix.browser }}-diff.png
          retention-days: 7

  generate-baseline:
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch'   # only runs when manually triggered
    strategy:
      matrix:
        include:
          - browser: chromium
            suite: testng-visual-chromium.xml

          - browser: firefox
            suite: testng-visual-firefox.xml

          - browser: webkit
            suite: testng-visual-webkit.xml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          npm install
          mvn install -DskipTests

      - name: Install Playwright dependencies
        run: |
          for i in 1 2 3; do
              npx playwright install-deps && break || sleep 30
          done

      - name: Install Playwright browsers
        run: npx playwright install

      # Create baseline subfolder for this browser
      - name: Create baseline directory
        run: mkdir -p src/test/resources/baseline/${{ matrix.browser }}

      # Run tests in baseline mode per browser
      - name: Generate baseline screenshots
        run: mvn test -DsuiteXmlFile=${{ matrix.suite }} -Dbaseline=true

      - name: Upload baseline screenshots
        uses: actions/upload-artifact@v4
        with:
            name: visual-regression-baseline-${{ matrix.browser }}
            path: src/test/resources/baseline/${{ matrix.browser }}/*.png
