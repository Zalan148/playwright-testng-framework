<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mock Cart</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        h1 { color: #333; }
        .cart-item { border-bottom: 1px solid #ccc; padding: 10px 0; }
        .cart-item span { display: inline-block; width: 200px; }
        .checkout { margin-top: 20px; }
        button { padding: 8px 16px; background: #007bff; color: #fff; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
<h1>Your Cart</h1>

<div class="cart-item">
    <span>Product A</span>
    <span>$29.99</span>
    <button>Remove</button>
</div>

<div class="cart-item">
    <span>Product B</span>
    <span>$49.99</span>
    <button>Remove</button>
</div>

<div class="checkout">
    <button>Proceed to Checkout</button>
</div>
</body>
</html>
